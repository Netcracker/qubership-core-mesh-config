{{- if eq .Values.SERVICE_MESH_TYPE "Istio" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.PRIVATE_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.PRIVATE_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - name: '{{ .Values.ISTIO_PRIVATE_GATEWAY_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - name: '{{ .Values.PRIVATE_FB_SERVICE_NAME }}'
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.PUBLIC_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.PUBLIC_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - name: '{{ .Values.ISTIO_PUBLIC_GATEWAY_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - name: '{{ .Values.PUBLIC_FB_SERVICE_NAME }}'
          port: 8080
---
# Catch-all for internal-gateway-service. Istio puts this regex after the other routes only when
# their parentRefs match this one, which sets no port. A route to internal-gateway-service that
# sets a port lands in a separate VirtualService, and this route shadows it when created earlier.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.INTERNAL_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.PUBLIC_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - group: ''
      kind: Service
      name: '{{ .Values.INTERNAL_SERVICE_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - group: ''
          kind: Service
          name: '{{ .Values.INTERNAL_FB_SERVICE_NAME }}'
          port: 8080
          weight: 1       
{{- end }}