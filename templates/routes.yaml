{{- if and (eq .Values.SERVICE_MESH_TYPE "Istio") (not (empty .Values.BASELINE_ORIGIN)) }}
{{- $baselineNamespace := .Values.BASELINE_CONTROLLER | default .Values.BASELINE_ORIGIN }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.PRIVATE_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.PRIVATE_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: '{{ .Values.ISTIO_PRIVATE_GATEWAY_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: '{{ printf "%s.%s.svc.cluster.local" .Values.PRIVATE_SERVICE_NAME $baselineNamespace }}'
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.PUBLIC_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.PUBLIC_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: '{{ .Values.ISTIO_PUBLIC_GATEWAY_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: '{{ printf "%s.%s.svc.cluster.local" .Values.PUBLIC_SERVICE_NAME $baselineNamespace }}'
          port: 8080
          weight: 1
---
# Catch-all for internal-gateway-service. Istio puts this regex after the other routes only when
# their parentRefs match this one, which sets no port. A route to internal-gateway-service that
# sets a port lands in a separate VirtualService, and this route shadows it when created earlier.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.INTERNAL_GW_ROUTE_NAME }}'
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.INTERNAL_GW_ROUTE_NAME "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - group: ''
      kind: Service
      name: '{{ .Values.INTERNAL_SERVICE_NAME }}'
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: .*
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: '{{ printf "%s.%s.svc.cluster.local" .Values.INTERNAL_SERVICE_NAME $baselineNamespace }}'
          port: 8080
          weight: 1
{{- end }}
