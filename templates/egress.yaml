{{- if not .Values.SKIP_EGRESS_GATEWAY_CREATION }}
{{- $gwName := .Values.ISTIO_EGRESS_GATEWAY_NAME }}
kind: Service
apiVersion: v1
metadata:
  name: '{{ .Values.EGRESS_GATEWAY_SERVICE_NAME }}'
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "110"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    {{- include "mesh.labels.service" (dict "root" . "name" .Values.EGRESS_GATEWAY_SERVICE_NAME ) | nindent 4 }}
spec:
  ports:
    - name: web
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    {{- if eq .Values.SERVICE_MESH_TYPE "Istio" }}
    gateway.networking.k8s.io/gateway-name: {{ $gwName | quote }}
    {{- else }}
    app: '{{ .Values.EGRESS_GATEWAY_SERVICE }}'
    {{- end }}
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
{{- if eq .Values.SERVICE_MESH_TYPE "Istio" }}
---
kind: Service
apiVersion: v1
metadata:
  name: '{{ .Values.EGRESS_FB_SERVICE_NAME }}'
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-80"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    {{- include "mesh.labels.service" (dict "root" . "name" .Values.EGRESS_FB_SERVICE_NAME ) | nindent 4 }}
spec:
  ports:
    - name: web
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    name: '{{ .Values.EGRESS_GATEWAY_SERVICE }}'
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-100"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    deployer.cleanup/allow: "true"
    {{- include "mesh.labels" (dict "root" . "name" .Values.EGRESS_GATEWAY_SERVICE_NAME  "processedByOperator" true) | nindent 4 }}
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ printf "%s-pod-options" $gwName }}
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
---
{{ include "mesh.gateway.deploymentCustomizationMap" (dict
  "name" $gwName
  "values" (dict
    "root" .
    "replicas" .Values.REPLICAS
    "cpuRequest" .Values.CPU_REQUEST
    "cpuLimit" .Values.EGRESS_GW_CPU_LIMIT
    "memoryLimit" .Values.EGRESS_GW_MEMORY_LIMIT
    "topologies" .Values.CLOUD_TOPOLOGIES
    "topologyKey" .Values.CLOUD_TOPOLOGY_KEY
  )
) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-route" $gwName }}
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-60"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    deployer.cleanup/allow: "true"
    {{- $routeName := printf "%s-route" $gwName | trunc 63 -}}
    {{- include "mesh.labels" (dict "root" . "name" $routeName "processedByOperator" true) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gwName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: '{{ .Values.EGRESS_FB_SERVICE_NAME }}'
          port: 8080
---
# TLS origination on the egress gateway. A DestinationRule that names a
# credentialName makes istiod push the referenced Secret to this gateway over SDS,
# and istiod first checks that the gateway's ServiceAccount may read Secrets in the
# namespace. That SubjectAccessReview carries no resource name, so a Role narrowed
# with resourceNames never satisfies it and the certificate is silently withheld:
# the DestinationRule still renders, and the handshake fails with
# "remote connection failure" and no error on either side.
#
# Only client certificates need this. istiod resolves a CA from <name>-cacert by a
# path that skips the check, which is why one-way origination works without it and
# mutual TLS does not.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-secret-reader" $gwName }}
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-90"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    deployer.cleanup/allow: "true"
    {{- $roleName := printf "%s-secret-reader" $gwName | trunc 63 -}}
    {{- include "mesh.labels" (dict "root" . "name" $roleName "processedByOperator" true) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-secret-reader" $gwName }}
  annotations:
    helm.sh/hook: "pre-install, pre-upgrade"
    helm.sh/hook-weight: "-85"
    helm.sh/hook-delete-policy: "before-hook-creation"
  labels:
    deployer.cleanup/allow: "true"
    {{- $bindingName := printf "%s-secret-reader" $gwName | trunc 63 -}}
    {{- include "mesh.labels" (dict "root" . "name" $bindingName "processedByOperator" true) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-secret-reader" $gwName }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-istio" $gwName }}
    namespace: {{ .Release.Namespace }}
---
{{ include "mesh.hpa" (dict
  "root" .
  "name" (printf "%s-istio" $gwName)
  "targetName" (printf "%s-istio" $gwName)
  "defaultMinReplicas" 2
  "defaultMaxReplicas" 10
  "averageUtilization" (int (divf
    (mulf (default 75 .Values.HPA_AVG_CPU_UTILIZATION_TARGET_PERCENT) (include "to_millicores" .Values.EGRESS_GW_CPU_LIMIT))
    (include "to_millicores" .Values.CPU_REQUEST)
  ))
) }}

{{- end }}
{{- end }}
